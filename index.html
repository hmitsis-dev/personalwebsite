<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harry Mitsis</title>
  <meta name="description" content="Harry Mitsis - Systems &amp; Automation Engineer">

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #38bdf8;
      --border-dark: #0369a1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #67e8f9;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(56,189,248,0.08) 0, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(56,189,248,0.08) 0, transparent 40%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 3rem 1.25rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      image-rendering: pixelated;
      width: 140px;
      height: auto;
      margin-bottom: 0.5rem;
    }

    .name {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.3rem;
      line-height: 1.6;
      margin: 1rem 0 0.75rem 0;
    }

    .tagline {
      color: var(--accent);
      font-size: 1rem;
      margin: 0 0 2.5rem 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
      margin-bottom: 2.5rem;
    }

    .info-card {
      background: var(--card);
      border: 3px solid var(--border-dark);
      box-shadow: 4px 4px 0 var(--border-dark);
      padding: 1rem 0.75rem;
      text-align: left;
    }

    .info-emoji {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 0.4rem;
    }

    .info-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: var(--accent);
      display: block;
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }

    .info-value {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.5;
    }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .links a {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      color: var(--bg);
      background: var(--border);
      text-decoration: none;
      padding: 0.75rem 1rem;
      border: 3px solid var(--border-dark);
      box-shadow: 3px 3px 0 var(--border-dark);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      display: inline-block;
    }

    .links a:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dark);
    }

    @media (max-width: 420px) {
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">

    <img class="avatar" src="assets/pixel-robot.gif" alt="Pixel art robot waving">

    <h1 class="name">Harry Mitsis</h1>
    <p class="tagline">Systems &amp; Automation Engineer</p>

    <div class="info-grid">
      <div class="info-card">
        <span class="info-emoji">📍</span>
        <span class="info-label">LOCATION</span>
        <p class="info-value">Italy</p>
      </div>
      <div class="info-card">
        <span class="info-emoji">💼</span>
        <span class="info-label">CURRENTLY</span>
        <p class="info-value">Infra &amp; DevOps @ Zucchetti Hospitality</p>
      </div>
      <div class="info-card">
        <span class="info-emoji">🐍</span>
        <span class="info-label">TOOLKIT</span>
        <p class="info-value">Python, Docker, Kubernetes, Terraform</p>
      </div>
      <div class="info-card">
        <span class="info-emoji">🚀</span>
        <span class="info-label">BUILDING</span>
        <p class="info-value">Self-hosted tools &amp; automation on the side</p>
      </div>
    </div>

    <div class="links">
      <a href="https://github.com/hmitsis-dev" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/charilaos-mitsis-5220401bb/" target="_blank">LinkedIn</a>
      <a href="mailto:harrymitsis@yahoo.com">Email</a>
    </div>

  </div>

</body>
</html>
